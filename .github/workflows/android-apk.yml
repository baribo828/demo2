name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -la

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build card app debug APK
        run: gradle :card-app:assembleDebug

      - name: Build reader app debug APK
        run: gradle :reader-app:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nfc-demo-debug-apks
          path: |
            card-app/build/outputs/apk/debug/*.apk
            reader-app/build/outputs/apk/debug/*.apk
